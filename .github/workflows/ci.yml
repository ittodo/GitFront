name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Rust format
        working-directory: rust
        run: cargo fmt --check
      - name: Rust lint
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Rust library tests
        working-directory: rust
        run: cargo test --locked --lib --bins
      - name: Rust repository integration tests
        working-directory: rust
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --locked --test repository_integration -- --test-threads=1
      - name: Windows build
        run: flutter build windows --debug
